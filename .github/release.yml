changelog:
  exclude:
    labels:
      - new-release
  categories:
    - title: 'New Features ✨'
      labels:
        - enhancement
    - title: Bug Fixes 🐞
      labels:
        - bug
    - title: 'Docs 📚'
      labels:
        - documentation
    - title: 'Dependencies 📦'
      labels:
        - dependencies
    - title: 'Other Changes 🔧'
      labels:
        - '*'